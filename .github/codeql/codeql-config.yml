name: "CodeQL Config - TestMind"

disable-default-queries: false

queries:
  - uses: security-and-quality/python
  - uses: security-extended/python
  - uses: ./custom-queries/

paths-ignore:
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/env/**"
  - "**/.env"
  - "**/tests/**"
  - "**/test_*/**"
  - "**/*_test.py"
  - "**/docs/**"
  - "**/banners/**"
  - "**/public/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/.pytest_cache/**"
  - "**/coverage/**"

paths:
  - "backend/app/**"
  - "backend/app/core/**"
  - "backend/app/api/**"
  - "backend/app/services/**"
  - "backend/app/models/**"
  - "backend/app/utils/**"
  - "frontend/src/**"
  - "frontend/src/components/**"
  - "frontend/src/services/**"
  - "frontend/src/utils/**"
  - "frontend/src/pages/**"

query-filters:
  # Security vulnerabilities
  - include:
      tags contain: security
  - include:
      tags contain: external
  - include:
      tags contain: injection
  - include:
      tags contain: xss
  - include:
      tags contain: path-traversal
  - include:
      tags contain: command-injection
  - include:
      tags contain: deserialization
  - include:
      tags contain: authentication
  - include:
      tags contain: authorization
  - include:
      tags contain: ai
  - include:
      tags contain: prompt-injection
  # Exclude SQL injection checks (no DB in project)
  - exclude:
      tags contain: sql-injection
  
  # Code quality issues
  - include:
      tags contain: correctness
  - include:
      tags contain: maintainability
  - include:
      tags contain: performance 